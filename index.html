<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攝影書 — curated by Jimmy</title>

  <!-- ============================================================
  攝影書網站模板
  ------------------------------------------------------------
  ◆ 首頁動態場景：目前是 Canvas 繪製的「雪山漫步」動畫（雪、霧、山稜、行走的人影）。
    之後要換成你的影片時：
      1. 找到下方 <section class="hero"> 裡標示【影片替換區】的註解
      2. 把 <canvas id="scene"> 註解掉，打開 <video> 那段
      3. 影片建議：5–10 秒、H.264 mp4、1080p、壓到 5MB 以內、loop + muted + autoplay + playsinline

  ◆ 電子書翻頁：
      每頁一張正方形 JPG，命名規則：cover.jpg（封面）、p01.jpg～pNN.jpg（內頁）、back.jpg（封底），
      放進資料夾後在 COLLECTIONS 設定 folder 與 count 即可，詳見翻頁書程式碼開頭的說明。
============================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --ink: #0C141F;
      /* 深夜藍黑 */
      --ink-2: #121D2B;
      --ice: #A9C7DA;
      /* 冰川藍 */
      --ice-dim: #6E8A9C;
      --snow: #EEF3F6;
      /* 雪白 */
      --paper: #F6F4EF;
      /* 書頁暖白 */
      --mist: #8A99A8;
      /* 霧灰 */
      --hairline: rgba(169, 199, 218, .18);
      --serif-tc: "Noto Serif TC", "PMingLiU", serif;
      --serif-en: "Cormorant Garamond", Georgia, serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    img,
    video {
      -webkit-user-drag: none
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--ink);
      color: var(--snow);
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.95;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--ice);
      color: var(--ink)
    }

    /* ---------- 導覽列 ---------- */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px clamp(20px, 5vw, 64px);
      mix-blend-mode: difference;
    }

    .nav .brand {
      font-family: var(--serif-en);
      font-size: 16px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }

    .nav .links {
      display: flex;
      gap: 30px
    }

    .nav .links a {
      color: #fff;
      text-decoration: none;
      font-size: 14.5px;
      letter-spacing: .28em;
      opacity: .75;
      transition: opacity .3s;
    }

    .nav .links a:hover,
    .nav .links a:focus-visible {
      opacity: 1
    }

    .nav a:focus-visible {
      outline: 1px solid var(--ice);
      outline-offset: 4px
    }

    /* ---------- 首頁 Hero ---------- */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      overflow: hidden
    }

    .hero canvas,
    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero .veil {
      /* 底部往上的漸層，讓文字穩定可讀 */
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--ink) 0%, rgba(12, 20, 31, .25) 34%, rgba(12, 20, 31, 0) 60%);
      pointer-events: none;
    }

    .hero .title-block {
      position: absolute;
      left: clamp(20px, 6vw, 80px);
      bottom: clamp(72px, 14vh, 140px);
      z-index: 3;
    }

    .hero .eyebrow {
      font-family: var(--serif-en);
      font-size: 13.5px;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--ice);
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(44px, 8vw, 104px);
      font-weight: 400;
      letter-spacing: .14em;
      line-height: 1.25;
    }

    .hero .sub {
      margin-top: 16px;
      font-size: clamp(16px, 1.7vw, 20px);
      letter-spacing: .24em;
      color: var(--mist);
    }

    .hero .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 11px;
      letter-spacing: .4em;
      color: var(--ice-dim);
      writing-mode: vertical-rl;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero .scroll-hint::after {
      content: "";
      display: block;
      width: 1px;
      height: 44px;
      background: linear-gradient(var(--ice), transparent);
      animation: drop 2.4s ease-in-out infinite;
    }

    @keyframes drop {
      0% {
        transform: scaleY(0);
        transform-origin: top
      }

      55% {
        transform: scaleY(1);
        transform-origin: top
      }

      56% {
        transform-origin: bottom
      }

      100% {
        transform: scaleY(0);
        transform-origin: bottom
      }
    }

    /* 標題進場 */
    .hero .title-block>* {
      opacity: 0;
      transform: translateY(22px);
      animation: rise 1.4s cubic-bezier(.2, .6, .2, 1) forwards
    }

    .hero .eyebrow {
      animation-delay: .5s
    }

    .hero h1 {
      animation-delay: .8s
    }

    .hero .sub {
      animation-delay: 1.15s
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* ---------- 共用 section ---------- */
    .section {
      padding: clamp(90px, 14vh, 160px) clamp(20px, 6vw, 80px);
      max-width: 1280px;
      margin: 0 auto
    }

    .sec-head {
      margin-bottom: clamp(44px, 7vh, 72px)
    }

    .sec-head .eyebrow {
      font-family: var(--serif-en);
      font-size: 13.5px;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--ice);
      margin-bottom: 14px;
    }

    .sec-head h2 {
      font-size: clamp(31px, 3.9vw, 47px);
      font-weight: 400;
      letter-spacing: .12em
    }

    .sec-head p {
      margin-top: 14px;
      color: var(--mist);
      max-width: 580px;
      font-size: 17px
    }

    /* ---------- 翻頁書 ---------- */
    .book-stage {
      position: relative;
      padding: clamp(28px, 5vw, 56px) 0 12px;
    }

    .book-wrap {
      perspective: 2800px;
      display: flex;
      justify-content: center;
    }

    .book {
      position: relative;
      transform-style: preserve-3d;
      /* 尺寸由 JS 依視窗寬度計算（A4 直式比例） */
      filter: drop-shadow(0 40px 60px rgba(0, 0, 0, .55));
    }

    .book::before {
      /* 書脊光影 */
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(0, 0, 0, .35);
      z-index: 60;
      transform: translateX(-.5px);
      pointer-events: none;
    }

    .sheet {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.35, .08, .18, 1);
      cursor: pointer;
    }

    .sheet.flipped {
      transform: rotateY(-180deg)
    }

    .sheet .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--paper);
    }

    .sheet .face img,
    .sheet .face canvas,
    .sheet .face video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .sheet .face.back {
      transform: rotateY(180deg)
    }

    .sheet .face::after {
      /* 靠近書脊的內陰影，增加紙感 */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0, 0, 0, .16), rgba(0, 0, 0, 0) 12%);
    }

    .sheet .face.back::after {
      background: linear-gradient(to left, rgba(0, 0, 0, .16), rgba(0, 0, 0, 0) 12%);
    }

    .book {
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none
    }

    /* 翻頁時跟著角度變化的動態陰影 */
    .face .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease;
      background: linear-gradient(to right, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 62%);
    }

    .face.back .shade {
      background: linear-gradient(to left, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 62%);
    }

    .sheet.flipping .shade {
      animation: shadePulse 1.1s ease
    }

    @keyframes shadePulse {
      0% {
        opacity: 0
      }

      45% {
        opacity: .5
      }

      100% {
        opacity: 0
      }
    }

    /* 書冊選單（點擊展開） */
    .book-menu {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: clamp(30px, 5vh, 52px);
      z-index: 30;
    }

    .menu-trigger {
      appearance: none;
      background: none;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--snow);
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: 17px;
      letter-spacing: .14em;
      padding: 15px 32px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      cursor: pointer;
      transition: .3s;
    }

    .menu-trigger:hover,
    .menu-trigger:focus-visible {
      border-color: var(--ice)
    }

    .menu-trigger:focus-visible {
      outline: 1px solid var(--ice);
      outline-offset: 3px
    }

    .menu-trigger .en {
      font-family: var(--serif-en);
      font-size: 12px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--ice);
    }

    .menu-trigger .sep {
      color: var(--ice-dim)
    }

    .menu-trigger .bk {
      color: var(--mist)
    }

    .menu-trigger .caret {
      color: var(--ice-dim);
      font-size: 12px;
      align-self: center;
      transition: transform .3s
    }

    .book-menu.open .menu-trigger .caret {
      transform: rotate(180deg)
    }

    .menu-panel {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      width: min(92vw, 760px);
      background: #111B28;
      border: 1px solid var(--hairline);
      box-shadow: 0 30px 60px rgba(0, 0, 0, .55);
      padding: clamp(24px, 4vw, 38px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      opacity: 0;
      visibility: hidden;
      transition: .35s cubic-bezier(.2, .6, .2, 1);
    }

    .book-menu.open .menu-panel {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0)
    }

    .menu-col-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--hairline);
      font-size: 16px;
      letter-spacing: .18em;
      color: var(--snow);
    }

    .menu-col-title .en {
      font-family: var(--serif-en);
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--ice);
    }

    .menu-books {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px
    }

    .menu-books button {
      appearance: none;
      background: none;
      border: none;
      color: var(--mist);
      cursor: pointer;
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: 15.5px;
      letter-spacing: .16em;
      padding: 8px 0;
      transition: .25s;
    }

    .menu-books button:hover,
    .menu-books button:focus-visible {
      color: var(--snow)
    }

    .menu-books button.active {
      color: var(--ice)
    }

    .menu-books button.active::before {
      content: "— ";
      color: var(--ice-dim)
    }

    /* 單面檢視：一次一張大圖或影片（尺寸與比例由 JS 依每本書的 ratio 計算） */
    .single-view {
      display: none;
      justify-content: center
    }

    .book-stage.single .book-wrap {
      display: none
    }

    .book-stage.single .single-view {
      display: flex
    }

    .single-media {
      max-width: 92vw;
      position: relative;
      background: var(--paper);
      box-shadow: 0 34px 64px rgba(0, 0, 0, .5);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .single-media img,
    .single-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: pageIn .4s ease;
    }

    @keyframes pageIn {
      from {
        opacity: .4
      }

      to {
        opacity: 1
      }
    }

    /* 光箱：放大檢視 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 10, 16, .95);
      display: grid;
      place-items: center;
    }

    .lightbox[hidden] {
      display: none
    }

    .lb-media {
      overflow: hidden;
      display: grid;
      place-items: center;
      max-width: 96vw;
      max-height: 92vh
    }

    .lb-media img,
    .lb-media video {
      max-width: 94vw;
      max-height: 88vh;
      display: block;
      transition: transform .5s cubic-bezier(.2, .6, .2, 1);
      cursor: zoom-in;
      user-select: none;
      -webkit-user-select: none;
    }

    .lb-media img.zoomed,
    .lb-media video.zoomed {
      transform: scale(2.4);
      cursor: zoom-out
    }

    .lb-close {
      position: absolute;
      top: 22px;
      right: 26px;
      z-index: 2;
      appearance: none;
      background: none;
      border: 1px solid var(--hairline);
      color: var(--snow);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: .3s;
      display: grid;
      place-items: center;
    }

    .lb-close:hover {
      border-color: var(--ice);
      color: var(--ice)
    }

    .lb-hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: .24em;
      color: var(--ice-dim);
      white-space: nowrap;
    }

    /* 單／雙切換 */
    .mode-toggle {
      display: inline-flex;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      overflow: hidden;
    }

    .mode-toggle button {
      appearance: none;
      background: none;
      border: none;
      color: var(--mist);
      font-family: var(--serif-tc);
      font-weight: 300;
      font-size: 15px;
      width: 50px;
      height: 46px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .3s;
      line-height: 1;
    }

    .mode-toggle button:hover {
      color: var(--snow)
    }

    .mode-toggle button.active {
      background: var(--ice);
      color: var(--ink)
    }

    .mode-toggle button:focus-visible {
      outline: 1px solid var(--ice);
      outline-offset: -3px
    }


    /* 足跡世界地圖 */
    #book.section {
      padding-bottom: clamp(56px, 8vh, 96px)
    }

    .map-block {
      margin-top: clamp(48px, 8vh, 84px);
      border-top: 1px solid var(--hairline);
      padding-top: clamp(30px, 5vh, 48px);
    }

    .map-block .map-title {
      display: flex;
      align-items: baseline;
      gap: 16px;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--mist);
      font-size: 16px;
      letter-spacing: .26em;
    }

    .map-block .map-title .en {
      font-family: var(--serif-en);
      font-size: 12.5px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--ice);
    }

    #worldMap {
      display: block;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto
    }

    /* 控制列 */
    .book-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 26px;
      margin-top: 34px;
    }

    .book-controls>button {
      appearance: none;
      background: none;
      border: 1px solid var(--hairline);
      color: var(--snow);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: .3s;
      display: grid;
      place-items: center;
      font-family: var(--serif-en);
    }

    .book-controls>button:hover,
    .book-controls>button:focus-visible {
      border-color: var(--ice);
      color: var(--ice);
    }

    .book-controls>button:focus-visible {
      outline: 1px solid var(--ice);
      outline-offset: 3px
    }

    .book-controls>button.active {
      background: var(--ice);
      color: var(--ink);
      border-color: var(--ice)
    }

    .book-controls .indicator {
      font-family: var(--serif-en);
      font-size: 15px;
      letter-spacing: .3em;
      color: var(--mist);
      min-width: 150px;
      text-align: center;
    }



    /* ---------- 關於 ---------- */
    .about {
      border-top: 1px solid var(--hairline)
    }

    .about-inner {
      display: grid;
      grid-template-columns: minmax(200px, 300px) minmax(0, 600px);
      gap: clamp(30px, 5vw, 70px);
      align-items: center;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .about-text {
      text-align: center
    }

    .about-text p {
      color: var(--mist);
      font-size: 17px;
      max-width: 50ch;
      margin: 0 auto
    }

    .about-text p+p {
      margin-top: 1em
    }

    .contact-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 32px
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--hairline);
      color: var(--ice);
      display: grid;
      place-items: center;
      transition: .3s;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      border-color: var(--ice);
      background: rgba(169, 199, 218, .08);
      transform: translateY(-2px);
    }

    .icon-btn:focus-visible {
      outline: 1px solid var(--ice);
      outline-offset: 3px
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    @media (max-width:760px) {
      .about-inner {
        grid-template-columns: 1fr
      }

      .about-photo {
        max-width: 280px;
        margin: 0 auto
      }
    }

    .about-photo {
      position: relative;
      aspect-ratio: 4/5;
      margin: 0;
      background: linear-gradient(160deg, #16222F, #0C141F);
      border: 1px solid var(--hairline);
      overflow: hidden;
    }

    .about-photo img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .about-photo .ph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--ice-dim);
      font-size: 13px;
      letter-spacing: .3em;
      line-height: 2.6;
    }


    /* ---------- Footer ---------- */
    footer {
      border-top: 1px solid var(--hairline);
      padding: 54px clamp(20px, 6vw, 80px);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
      align-items: center;
    }

    footer .brand {
      font-family: var(--serif-en);
      letter-spacing: .42em;
      font-size: 14px;
      text-transform: uppercase;
      color: var(--ice)
    }

    footer .fine {
      font-size: 13.5px;
      color: var(--ice-dim);
      letter-spacing: .16em
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    @media (max-width:640px) {
      .nav .links {
        display: none
      }
    }

    /* ---------- 手機版微調 ---------- */
    @media (max-width:760px) {
      .about-inner { grid-template-columns: 1fr; gap: 34px; }
      .about-photo { width: min(72vw, 280px); margin: 0 auto; }
      .about-text p { max-width: 30ch; font-size: 16px; }
      .about-text p+p { margin-top: .7em; }
      .contact-row { margin-top: 26px; }
    }
    @media (max-width:640px) {
      .hero .scroll-hint { display: none; }   /* 避免與標題重疊 */
    }
  </style>
</head>

<body>

  <nav class="nav">

  <script>
    /* ==========================================================
       一、首頁「雪山漫步」動態場景（Canvas）
       ========================================================== */
    (function () {
      const cv = document.getElementById('scene');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W, H, DPR, ridges = [], flakes = [], frontRidge = [];
      let pTX = 0, pTY = 0, pX = 0, pY = 0;   /* 滑鼠視差（平滑跟隨） */
      addEventListener('pointermove', e => {
        pTX = e.clientX / innerWidth - 0.5;
        pTY = e.clientY / innerHeight - 0.5;
      });

      // 可重現的偽隨機（讓山形固定）
      function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

      function makeRidge(seed, baseY, amp, step) {
        const rnd = mulberry32(seed);
        const pts = []; let y = baseY + (rnd() - 0.5) * amp;
        for (let x = -40; x <= W + 40; x += step) {
          y += (rnd() - 0.5) * amp * 0.4;
          y = Math.min(Math.max(y, baseY - amp), baseY + amp * 0.6);
          pts.push({ x, y });
        }
        return pts;
      }

      function resize() {
        DPR = Math.min(devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * DPR; cv.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        ridges = [
          { pts: makeRidge(11, H * 0.48, H * 0.16, 26), color: '#16222F', drift: 4 },
          { pts: makeRidge(23, H * 0.60, H * 0.14, 22), color: '#111B27', drift: 9 },
          { pts: makeRidge(37, H * 0.74, H * 0.11, 18), color: '#0C141F', drift: 16 },
        ];
        frontRidge = ridges[0].pts;   /* 登山者走在最上方的稜線，剪影襯著天空更明顯 */

        flakes = Array.from({ length: Math.min(180, W / 6) }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: 0.6 + Math.random() * 1.8, s: 0.35 + Math.random() * 0.9,
          p: Math.random() * Math.PI * 2
        }));
      }

      function ridgeY(x) {
        const pts = frontRidge;
        for (let i = 1; i < pts.length; i++) {
          if (x <= pts[i].x) {
            const a = pts[i - 1], b = pts[i], t = (x - a.x) / (b.x - a.x);
            return a.y + (b.y - a.y) * t;
          }
        }
        return pts[pts.length - 1].y;
      }

      // 行走的人影
      let hikerX = null;   /* 首次繪製時直接出現在畫面中 */
      function drawHiker(t) {
        if (hikerX === null) hikerX = W * 0.3;
        hikerX += 0.187;   /* 步速：原本 0.22 的 0.85 倍 */
        if (hikerX > W + 80) hikerX = -80;
        const gy = ridgeY(hikerX) - 1;
        const s = 1.3;                            // 比例（調大剪影更明顯）
        const bob = Math.sin(t * 0.006) * 0.8;        // 步伐起伏
        const leg = Math.sin(t * 0.006);            // 腿部擺動
        ctx.save();
        ctx.translate(hikerX, gy + bob);

        // 頭燈光暈（與地圖定位點同色的暖金黃，帶一點自然閃爍）
        const flick = 0.85 + Math.sin(t * 0.013) * 0.1 + Math.sin(t * 0.037) * 0.05;
        const hx = 3.4 * s, hy = -24 * s;                      // 燈的位置（額頭）
        const glow = ctx.createRadialGradient(hx + 4 * s, hy + 1.5 * s, 0, hx + 4 * s, hy + 1.5 * s, 20 * s);
        glow.addColorStop(0, 'rgba(246,228,178,' + (0.5 * flick).toFixed(3) + ')');
        glow.addColorStop(0.35, 'rgba(246,228,178,' + (0.16 * flick).toFixed(3) + ')');
        glow.addColorStop(1, 'rgba(246,228,178,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(hx + 4 * s, hy + 1.5 * s, 20 * s, 0, 7); ctx.fill();
        // 往前下方照的光束
        const beam = ctx.createLinearGradient(hx, hy, hx + 16 * s, hy + 7 * s);
        beam.addColorStop(0, 'rgba(246,228,178,' + (0.32 * flick).toFixed(3) + ')');
        beam.addColorStop(1, 'rgba(246,228,178,0)');
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + 17 * s, hy + 2.5 * s);
        ctx.lineTo(hx + 14 * s, hy + 11 * s);
        ctx.closePath(); ctx.fill();

        ctx.strokeStyle = '#05090F';
        ctx.fillStyle = '#05090F';
        ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round';
        // 腿
        ctx.beginPath();
        ctx.moveTo(0, -10 * s); ctx.lineTo(4 * leg * s, 0);
        ctx.moveTo(0, -10 * s); ctx.lineTo(-4 * leg * s, 0);
        ctx.stroke();
        // 身體（微前傾）
        ctx.beginPath(); ctx.moveTo(0, -10 * s); ctx.lineTo(1.6 * s, -21 * s); ctx.stroke();
        // 背包（大容量登山包＋頂袋）
        ctx.beginPath(); ctx.ellipse(-2.4 * s, -16.5 * s, 4.4 * s, 6.4 * s, 0.22, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-2.8 * s, -22.6 * s, 2.4 * s, 1.9 * s, 0.25, 0, 7); ctx.fill();
        // 頭
        ctx.beginPath(); ctx.arc(2.2 * s, -24 * s, 2.6 * s, 0, 7); ctx.fill();
        // 頭燈本體亮點
        ctx.beginPath(); ctx.arc(hx, hy, 1.2 * s, 0, 7);
        ctx.fillStyle = '#F6E4B2'; ctx.fill();
        ctx.fillStyle = '#05090F';
        // 登山杖
        ctx.lineWidth = 1.2 * s;
        ctx.beginPath(); ctx.moveTo(2 * s, -14 * s); ctx.lineTo(8 * s + 3 * leg * s, 0); ctx.stroke();
        ctx.restore();
      }

      function drawRidgeLayer(r, i, t) {
        const dx = reduced ? 0 : Math.sin(t * 0.00005 * (i + 1)) * r.drift + pX * (3 + i * 6);
        const dy = reduced ? 0 : pY * (1.5 + i * 3);
        ctx.save(); ctx.translate(dx, dy);
        ctx.beginPath();
        ctx.moveTo(r.pts[0].x, r.pts[0].y);
        r.pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(W + 60, H); ctx.lineTo(-60, H); ctx.closePath();
        ctx.fillStyle = r.color; ctx.fill();
        // 稜線上的雪光
        ctx.beginPath();
        ctx.moveTo(r.pts[0].x, r.pts[0].y);
        r.pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = `rgba(190,214,229,${0.28 - i * 0.07})`;
        ctx.lineWidth = 1.4; ctx.stroke();
        ctx.restore();
      }

      function draw(t) {
        // 天空
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#1B2A3C');
        sky.addColorStop(0.55, '#152130');
        sky.addColorStop(1, '#0C141F');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

        if (!reduced) { pX += (pTX - pX) * 0.05; pY += (pTY - pY) * 0.05; }

        // 月暈（遠景：與滑鼠反向微移，強化空間深度）
        ctx.save(); ctx.translate(-pX * 5, -pY * 3);
        const mg = ctx.createRadialGradient(W * 0.74, H * 0.2, 10, W * 0.74, H * 0.2, H * 0.4);
        mg.addColorStop(0, 'rgba(210,228,240,.5)');
        mg.addColorStop(0.12, 'rgba(180,205,222,.14)');
        mg.addColorStop(1, 'rgba(180,205,222,0)');
        ctx.fillStyle = mg; ctx.fillRect(-20, -20, W + 40, H + 40);
        ctx.beginPath(); ctx.arc(W * 0.74, H * 0.2, 14, 0, 7);
        ctx.fillStyle = 'rgba(238,243,246,.95)'; ctx.fill();
        ctx.restore();

        // 依遠近順序繪製：最遠稜線 → 行走的人影 → 較近的稜線
        // 這樣人被前面的稜線擋住時是自然的「走到山後面」，而不是浮在山的前面
        drawRidgeLayer(ridges[0], 0, t);
        const dx0 = reduced ? 0 : Math.sin(t * 0.00005) * ridges[0].drift + pX * 3;
        ctx.save(); ctx.translate(dx0, reduced ? 0 : pY * 1.5);
        drawHiker(reduced ? 0 : t);
        ctx.restore();
        drawRidgeLayer(ridges[1], 1, t);
        drawRidgeLayer(ridges[2], 2, t);

        // 霧帶
        const fx = reduced ? 0 : (t * 0.012) % (W * 2) - W;
        const fog = ctx.createRadialGradient(fx + W * 0.5, H * 0.62, 20, fx + W * 0.5, H * 0.62, W * 0.5);
        fog.addColorStop(0, 'rgba(150,175,195,.10)');
        fog.addColorStop(1, 'rgba(150,175,195,0)');
        ctx.fillStyle = fog; ctx.fillRect(0, 0, W, H);

        // 雪
        ctx.fillStyle = 'rgba(238,243,246,.85)';
        flakes.forEach(f => {
          if (!reduced) {
            f.y += f.s; f.x += Math.sin(t * 0.001 + f.p) * 0.3;
            if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W }
          }
          ctx.globalAlpha = 0.25 + f.r * 0.28;
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function loop(t) { draw(t); if (!reduced) requestAnimationFrame(loop); }
      addEventListener('resize', resize);
      resize(); requestAnimationFrame(loop);
    })();

    /* ==========================================================
       網站圖示（favicon）：用 Canvas 即時繪製，不需要準備圖檔
       想改成固定檔案：在瀏覽器開發者工具把 dataURL 存成 favicon.png，
       再改用 <link rel="icon" href="favicon.png"> 即可
       ========================================================== */
    (function () {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      // 夜空底色（圓角方形）
      g.beginPath();
      g.roundRect ? g.roundRect(0, 0, 64, 64, 14) : g.rect(0, 0, 64, 64);
      const sky = g.createLinearGradient(0, 0, 0, 64);
      sky.addColorStop(0, '#1B2A3C'); sky.addColorStop(1, '#0C141F');
      g.fillStyle = sky; g.fill();
      g.save(); g.clip();
      // 月亮
      g.beginPath(); g.arc(46, 17, 6.5, 0, 7);
      g.fillStyle = '#EEF3F6'; g.fill();
      // 遠山
      g.beginPath();
      g.moveTo(-6, 46); g.lineTo(16, 24); g.lineTo(30, 40); g.lineTo(44, 28); g.lineTo(70, 52);
      g.lineTo(70, 70); g.lineTo(-6, 70); g.closePath();
      g.fillStyle = '#24364A'; g.fill();
      // 近山＋稜線雪光
      g.beginPath();
      g.moveTo(-6, 58); g.lineTo(22, 36); g.lineTo(40, 52); g.lineTo(54, 42); g.lineTo(70, 58);
      g.lineTo(70, 70); g.lineTo(-6, 70); g.closePath();
      g.fillStyle = '#131E2C'; g.fill();
      g.beginPath();
      g.moveTo(-6, 58); g.lineTo(22, 36); g.lineTo(40, 52); g.lineTo(54, 42); g.lineTo(70, 58);
      g.strokeStyle = 'rgba(190,214,229,.75)'; g.lineWidth = 2; g.stroke();
      g.restore();
      const link = document.createElement('link');
      link.rel = 'icon'; link.type = 'image/png';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    })();

    /* ==========================================================
       二、翻頁攝影書（主題／書本兩層・單雙面・拖曳翻頁・足跡地圖）
       ----------------------------------------------------------
       ◆ 結構：COLLECTIONS（主題，例如 Vol. I）→ 每個主題底下有多本 books
       ◆ 每本書的設定：
           title  : 書名
           folder : 圖片資料夾，例如 'books/vol1/snow-trek'
           count  : 「內頁」張數（不含封面封底）
           ratio  : 頁面比例＝高÷寬，每本書可以不同
                    （1＝正方形、1.414＝A4 直式、0.75＝4:3 橫式、1.25＝4:5 直式）
           places : 這本書的拍攝地點，會標在下方的足跡世界地圖上
                    [{name:'雪山主峰', lat:24.39, lng:121.23, page:3}, ...]
                    page 為選填：該地點對應的內頁編號，設定後點地圖光點會直接跳到那一頁
       ◆ 圖片命名（每頁一張 JPG）：
           cover.jpg（封面）、p01.jpg～pNN.jpg（內頁，兩位數）、back.jpg（封底）
           → folder + count 設定好就會自動載入
       ◆ 也可手動列出：pages:['xx/cover.jpg','xx/p01.jpg',...,'xx/back.jpg']
       ◆ 書裡可以放短影片：pages 中直接混入 .mp4 檔即可，會自動靜音循環播放，
         例如 pages:['xx/cover.jpg','xx/p01.jpg','xx/p02.mp4','xx/p03.jpg',...]
         （含影片的書請用手動 pages 列法；影片建議 5–10 秒、壓在 5MB 內）
       ◆ 新增主題或書：在 COLLECTIONS 照格式複製一筆即可，選單自動出現
       ◆ folder / pages 皆為空時顯示示範內頁；內頁建議偶數張，雙面跨頁才完整
       ◆ 每本書有獨立網址：#book1-1（第 1 個主題的第 1 本）、#book2-1…
       ========================================================== */
    const COLLECTIONS = [
      {
        en: 'Vol. I', title: '日本東北', books: [
          {
            title: '御釜', folder: 'vol1_okama', count: 14, ratio: 1, pages: [],
            tint: ['#16222F', '#0C141F', 'rgba(169,199,218,.24)'],
            places: [
              { name: '御釜', lat: 38.14, lng: 140.44, page: 1 },
            ]
          },
        ]
      },
      {
        en: 'Vol. II', title: 'The Last Summer', books: [
          {
            title: '瑞士策馬特', folder: '', count: 0, ratio: 1, pages: ['vol2_zermatt/cover.jpg', 'vol2_zermatt/p01.jpg', 'vol2_zermatt/p02.jpg', 'vol2_zermatt/p03.jpg', 'vol2_zermatt/p04.mp4', 'vol2_zermatt/p05.mp4', 'vol2_zermatt/p06.jpg', 'vol2_zermatt/back.jpg'],
            tint: ['#1B2620', '#0E1512', 'rgba(168,196,178,.24)'],
            places: [
              { name: 'Zermatt', lat: 45.98, lng: 7.76 },
            ]
          },
        ]
      },
    ];

    /* 點陣世界地圖資料：240×107 網格（經度每 1.5°、緯度 75°N～85.5°S，含南極洲），
       由真實海岸線資料預先計算、壓成 base64，不需載入任何外部圖資 */
    const MAP_COLS = 240, MAP_ROWS = 107, MAP_LAT_TOP = 75, MAP_LAT_BOT = -85.5;

      function drawMapFrame(t) {
        if (!mapBase) return;
        mctx.clearRect(0, 0, mapW, mapH);
        mctx.drawImage(mapBase, 0, 0, mapW, mapH);
        mapPlaces.forEach((p, i) => {
          const { x, y } = project(p.lat, p.lng);
          /* 呼吸光圈：淡金色，由內往外擴散淡出 */
          const cycle = reducedMotion ? 0.5 : ((t + i * 700) % 2200) / 2200;
          const pr = 6 + cycle * 18;
          mctx.beginPath(); mctx.arc(x, y, pr, 0, 7);
          mctx.strokeStyle = 'rgba(242,220,168,' + ((1 - cycle) * 0.6).toFixed(3) + ')';
          mctx.lineWidth = 1.2; mctx.stroke();
          /* 定位點：淡黃色微光 */
          const glow = mctx.createRadialGradient(x, y, 0, x, y, 9);
          glow.addColorStop(0, 'rgba(246,228,178,.9)');
          glow.addColorStop(1, 'rgba(246,228,178,0)');
          mctx.fillStyle = glow;
          mctx.beginPath(); mctx.arc(x, y, 9, 0, 7); mctx.fill();
          mctx.beginPath(); mctx.arc(x, y, 4.4, 0, 7);
          mctx.fillStyle = '#F6E4B2'; mctx.fill();
          /* 地名 */
          mctx.font = '300 14px "Noto Serif TC",serif';
          mctx.textAlign = 'center';
          mctx.fillStyle = 'rgba(246,235,210,.92)';
          const ty = y > 24 ? y - 14 : y + 26;
          mctx.fillText(p.name, clamp(x, 40, mapW - 40), ty);
        });
        if (!reducedMotion && mapAnimating) requestAnimationFrame(drawMapFrame);
      }

      function updateMapPlaces() {
        mapPlaces = (book && book.places) ? book.places : [];
        mapBlock.style.display = mapPlaces.length ? '' : 'none';
        if (!mapPlaces.length) { mapAnimating = false; return; }
        layoutMap();
        if (reducedMotion) { drawMapFrame(0); }
        else if (!mapAnimating) { mapAnimating = true; requestAnimationFrame(drawMapFrame); }
      }

      /* ---------- 控制列與鍵盤 ---------- */
      document.getElementById('nextBtn').addEventListener('click', next);
      document.getElementById('prevBtn').addEventListener('click', prev);
      addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeLightbox(); closeMenu(); return; }
        if (!lightbox.hidden) return;
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
      });
      addEventListener('resize', () => { bookSize(); if (mapPlaces.length) layoutMap(); });

      /* ---------- 初始化：讀取網址（#book主題-書本），預設單面 ---------- */
      function fromHash() {
        const m = location.hash.match(/^#book(\d+)(?:-(\d+))?$/);
        return m ? [parseInt(m[1], 10) - 1, m[2] ? parseInt(m[2], 10) - 1 : 0] : [0, 0];
      }
      const [ci, bi] = fromHash();
      selectBook(ci, bi);
      setMode('single');
      if (location.hash.match(/^#book/)) {
        setTimeout(() => document.getElementById('book').scrollIntoView(), 150);
      }
      addEventListener('hashchange', () => {
        const [c, b] = fromHash();
        if (c !== activeCol || b !== activeIdx) selectBook(c, b);
      });
    })();
  </script>
